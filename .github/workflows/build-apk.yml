
name: Build Messio Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.3.10'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Fix old Flutter buttons
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          def split_args(source):
              parts = []
              start = 0
              stack = []
              quote = None
              escaped = False

              pairs = {')': '(', ']': '[', '}': '{'}

              for i, ch in enumerate(source):
                  if quote:
                      if escaped:
                          escaped = False
                      elif ch == '\\':
                          escaped = True
                      elif ch == quote:
                          quote = None
                      continue

                  if ch in ("'", '"'):
                      quote = ch
                  elif ch in '([{':
                      stack.append(ch)
                  elif ch in ')]}':
                      if stack and stack[-1] == pairs[ch]:
                          stack.pop()
                  elif ch == ',' and not stack:
                      parts.append(source[start:i].strip())
                      start = i + 1

              if source[start:].strip():
                  parts.append(source[start:].strip())

              return parts

          def patch_text_buttons(source):
              matches = list(re.finditer(r'\bTextButton\s*\(', source))

              for match in reversed(matches):
                  opening = source.find('(', match.start())
                  depth = 0
                  quote = None
                  escaped = False
                  closing = None

                  for i in range(opening, len(source)):
                      ch = source[i]

                      if quote:
                          if escaped:
                              escaped = False
                          elif ch == '\\':
                              escaped = True
                          elif ch == quote:
                              quote = None
                          continue

                      if ch in ("'", '"'):
                          quote = ch
                      elif ch == '(':
                          depth += 1
                      elif ch == ')':
                          depth -= 1
                          if depth == 0:
                              closing = i
                              break

                  if closing is None:
                      raise RuntimeError("Unclosed TextButton")

                  body = source[opening + 1:closing]
                  args = split_args(body)

                  kept = []
                  padding = None
                  color = None
                  style = None

                  for arg in args:
                      item = re.match(r'^(\w+)\s*:\s*(.*)$', arg, re.S)

                      if not item:
                          kept.append(arg)
                          continue

                      name, value = item.groups()

                      if name == 'padding':
                          padding = value
                      elif name == 'color':
                          color = value
                      elif name == 'style':
                          style = value
                      else:
                          kept.append(arg)

                  if style and 'TextButton.styleFrom(' in style:
                      inner = style[style.find('(') + 1:style.rfind(')')]
                      style_args = split_args(inner)
                      for item in style_args:
                          if item.startswith('padding:'):
                              padding = item.split(':', 1)[1].strip()
                          elif item.startswith('backgroundColor:'):
                              color = item.split(':', 1)[1].strip()
                          else:
                              kept_style = item
                              if 'extra_style' not in locals():
                                  extra_style = []
                              extra_style.append(kept_style)

                  if padding or color or style:
                      style_parts = []
                      if padding:
                          style_parts.append('padding: ' + padding)
                      if color:
                          style_parts.append('backgroundColor: ' + color)

                      style_arg = 'style: TextButton.styleFrom(' + ', '.join(style_parts) + ')'
                      kept.append(style_arg)

                  replacement = 'TextButton(' + ', '.join(kept) + ')'
                  source = source[:match.start()] + replacement + source[closing + 1:]

              return source

          app_files = [
              Path("lib/pages/register_page.dart"),
              Path("lib/pages/settings_page.dart"),
              Path("lib/widgets/number_picker.dart"),
          ]

          for file in app_files:
              text = file.read_text()
              text = text.replace("FlatButton.icon(", "TextButton.icon(")
              text = text.replace("FlatButton(", "TextButton(")
              text = text.replace("RaisedButton(", "ElevatedButton(")
              file.write_text(text)
              print("Updated:", file)

          cache = Path.home() / ".pub-cache/hosted"
          packages = list(cache.glob("*/emoji_picker-0.1.0/lib/emoji_picker.dart"))

          if not packages:
              raise SystemExit("emoji_picker not found")

          file = packages[0]
          source = file.read_text()
          source = source.replace("FlatButton(", "TextButton(")
          source = patch_text_buttons(source)
          file.write_text(source)

          print("Emoji picker buttons patched successfully.")
          PY

      - name: Build APK
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Messio-Android-APK
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7
