
name: Build Messio Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.7.12'
          channel: stable
          cache: true

      - name: Install dependencies
        run: |
          flutter doctor -v
          flutter pub get

      - name: Fix old emoji picker
        shell: bash
        run: |
          PACKAGE_DIR=$(find "$HOME/.pub-cache/hosted/pub.dev" \
            -maxdepth 1 -type d \
            -name 'emoji_picker-*' | head -n 1)

          if [ -z "$PACKAGE_DIR" ]; then
            echo "emoji_picker package not found"
            exit 1
          fi

          FILE="$PACKAGE_DIR/lib/emoji_picker.dart"

          sed -i 's/FlatButton(/TextButton(/g' "$FILE"

          sed -i \
            's/padding: EdgeInsets.all(0),/style: TextButton.styleFrom(padding: EdgeInsets.all(0)),/g' \
            "$FILE"

      - name: Build APK
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Messio-Android-APK
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7
