
name: Build Messio Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.7.12'
          channel: stable
          cache: true

      - name: Install dependencies
        run: |
          flutter doctor -v
          flutter pub get

      - name: Fix old emoji picker
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          cache = Path.home() / ".pub-cache/hosted/pub.dev"
          packages = sorted(cache.glob("emoji_picker-*"))

          if not packages:
              raise SystemExit("emoji_picker package not found")

          file = packages[0] / "lib/emoji_picker.dart"
          source = file.read_text()

          source = source.replace("FlatButton(", "TextButton(")

          source = re.sub(
              r'(?m)^(\s*)padding:\s*EdgeInsets\.all\(0\),',
              r'\1style: TextButton.styleFrom(padding: EdgeInsets.all(0)),',
              source
          )

          file.write_text(source)
          print("Emoji picker patched:", file)
          PY

      - name: Build APK
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Messio-Android-APK
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7
