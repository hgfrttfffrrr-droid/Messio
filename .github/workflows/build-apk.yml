
name: Build Messio Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.3.10'
          channel: stable
          cache: true

      - name: Install dependencies
        run: |
          flutter doctor -v
          flutter pub get

      - name: Fix emoji picker compatibility
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          cache = Path.home() / ".pub-cache/hosted"
          files = list(cache.glob("*/emoji_picker-0.1.0/lib/emoji_picker.dart"))

          if not files:
              raise SystemExit("emoji_picker source not found")

          file = files[0]
          source = file.read_text()

          marker = "class _EmojiPickerState extends State<EmojiPicker> {"

          compatibility = """
          // Compatibility replacement for the removed Flutter FlatButton.
          class FlatButton extends StatelessWidget {
            final VoidCallback onPressed;
            final Widget child;
            final EdgeInsetsGeometry padding;
            final Color color;
            final ShapeBorder shape;

            FlatButton({
              Key key,
              this.onPressed,
              this.child,
              this.padding,
              this.color,
              this.shape,
            }) : super(key: key);

            @override
            Widget build(BuildContext context) {
              return TextButton(
                style: TextButton.styleFrom(
                  backgroundColor: color,
                  padding: padding,
                  shape: shape,
                ),
                onPressed: onPressed,
                child: child,
              );
            }
          }

          """

          if "class FlatButton extends StatelessWidget" not in source:
              if marker not in source:
                  raise SystemExit("Could not find insertion point")
              source = source.replace(marker, compatibility + marker, 1)
              file.write_text(source)

          print("Emoji picker compatibility patch applied.")
          PY

      - name: Build APK
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Messio-Android-APK
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7
