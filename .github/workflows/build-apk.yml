
name: Build Messio Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.3.10'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Migrate old buttons
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          def split_args(source):
              result = []
              start = 0
              stack = []
              quote = None
              escaped = False
              pairs = {')': '(', ']': '[', '}': '{'}

              for i, ch in enumerate(source):
                  if quote:
                      if escaped:
                          escaped = False
                      elif ch == '\\':
                          escaped = True
                      elif ch == quote:
                          quote = None
                      continue

                  if ch in ("'", '"'):
                      quote = ch
                  elif ch in '([{':
                      stack.append(ch)
                  elif ch in ')]}':
                      if stack and stack[-1] == pairs[ch]:
                          stack.pop()
                  elif ch == ',' and not stack:
                      if source[start:i].strip():
                          result.append(source[start:i].strip())
                      start = i + 1

              if source[start:].strip():
                  result.append(source[start:].strip())

              return result

          def migrate(source):
              pattern = re.compile(r'\bTextButton\s*\(')

              while True:
                  match = pattern.search(source)
                  if not match:
                      break

                  opening = source.find('(', match.start())
                  depth = 0
                  quote = None
                  escaped = False
                  closing = None

                  for i in range(opening, len(source)):
                      ch = source[i]

                      if quote:
                          if escaped:
                              escaped = False
                          elif ch == '\\':
                              escaped = True
                          elif ch == quote:
                              quote = None
                          continue

                      if ch in ("'", '"'):
                          quote = ch
                      elif ch == '(':
                          depth += 1
                      elif ch == ')':
                          depth -= 1
                          if depth == 0:
                              closing = i
                              break

                  if closing is None:
                      raise RuntimeError("Invalid TextButton constructor")

                  args = split_args(source[opening + 1:closing])

                  normal = []
                  style_values = {}

                  for arg in args:
                      item = re.match(r'^(\w+)\s*:\s*(.*)$', arg, re.S)

                      if not item:
                          normal.append(arg)
                          continue

                      name, value = item.groups()

                      mapping = {
                          'padding': 'padding',
                          'color': 'backgroundColor',
                          'shape': 'shape',
                      }

                      if name in mapping:
                          style_values[mapping[name]] = value.strip()
                      else:
                          normal.append(arg)

                  if style_values:
                      existing = [
                          x for x in normal
                          if re.match(r'^style\s*:', x)
                      ]

                      if existing:
                          raise RuntimeError(
                              "TextButton already has style; manual merge needed"
                          )

                      values = [
                          f'{key}: {value}'
                          for key, value in style_values.items()
                      ]

                      normal.append(
                          'style: TextButton.styleFrom(' +
                          ', '.join(values) + ')'
                      )

                  replacement = 'TextButton(' + ', '.join(normal) + ')'
                  source = source[:match.start()] + replacement + source[closing + 1:]

              return source

          app_files = [
              Path("lib/pages/register_page.dart"),
              Path("lib/pages/settings_page.dart"),
              Path("lib/widgets/number_picker.dart"),
          ]

          for file in app_files:
              source = file.read_text()
              source = source.replace("FlatButton.icon(", "TextButton.icon(")
              source = source.replace("FlatButton(", "TextButton(")
              source = source.replace("RaisedButton(", "ElevatedButton(")
              file.write_text(source)
              print("Updated:", file)

          cache = Path.home() / ".pub-cache/hosted"
          packages = list(
              cache.glob("*/emoji_picker-0.1.0/lib/emoji_picker.dart")
          )

          if not packages:
              raise SystemExit("emoji_picker package not found")

          file = packages[0]
          source = file.read_text()
          source = source.replace("FlatButton(", "TextButton(")
          source = migrate(source)
          file.write_text(source)

          print("Emoji picker migration completed.")
          PY

      - name: Build APK
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Messio-Android-APK
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7
